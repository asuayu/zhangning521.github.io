name: Check personal workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/check-calendar-sync.cjs
      - run: python -m unittest discover -s tools -p 'test_*.py'
